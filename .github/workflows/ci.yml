name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

  # Builds on the dashboard's output to smoke-test the actual merged
  # deliverable: the server serving the dashboard build + API on one port.
  server:
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
      - run: npm install
        working-directory: server
      - name: Start server and smoke-test it serves both the dashboard and the API
        working-directory: server
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/issues > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/issues > /dev/null
          curl -sf http://localhost:8080/ | grep -q "A11y Auditor Dashboard"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # No Gradle wrapper jar is committed (see README) — provision Gradle
      # directly instead of relying on ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
