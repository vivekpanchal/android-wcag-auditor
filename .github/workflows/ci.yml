name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # dashboard/ and server/ are npm workspaces under the repo root — one
  # install, one `npm start` builds the dashboard and boots the server on
  # it, same as the README's documented flow. Smoke-tests the real merged
  # deliverable: the server serving the dashboard build + API on one port.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Start app and smoke-test it serves both the dashboard and the API
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/issues > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/issues > /dev/null
          curl -sf http://localhost:8080/ | grep -q "A11y Auditor Dashboard"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # No Gradle wrapper jar is committed (see README) — provision Gradle
      # directly instead of relying on ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
