name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # dashboard/ is an npm workspace under the repo root: install, test and
  # build it. The backend lives in the APK (see the android job).
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The APK bundles dashboard/dist, so build it before Gradle.
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: android-actions/setup-android@v3
      # Caching only; the version comes from the committed wrapper.
      - uses: gradle/actions/setup-gradle@v4
      # `bash gradlew` so the script runs even if its exec bit was lost on a Windows commit.
      - run: bash gradlew testDebugUnitTest assembleDebug
